name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          TAG=${GITHUB_REF_NAME}
          cp build/app/outputs/flutter-apk/app-release.apk VisioIridis-${TAG}.apk
          cp build/app/outputs/bundle/release/app-release.aab VisioIridis-${TAG}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VisioIridis-${{ github.ref_name }}.apk
            VisioIridis-${{ github.ref_name }}.aab
          generate_release_notes: true
